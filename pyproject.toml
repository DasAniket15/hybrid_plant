[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-plant"
version = "0.1.0"
description = "Hybrid RE plant (Solar + Wind + BESS) financial model for C&I clients"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "matplotlib",
    "pyomo>=6.7",
    "highspy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "plotly",
    "ruff>=0.6",
    "optuna",          # required by the slow tests/test_solver.py legacy suite
]
# Legacy Optuna TPE search path (hybrid_plant.legacy.solver_engine).
# Not used by the production Pyomo engine; install only to run engine: optuna.
legacy = [
    "optuna",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"
markers = [
    "slow: marks slow-running tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
