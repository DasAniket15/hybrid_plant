[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-plant"
version = "0.1.0"
description = "Hybrid RE plant (Solar + Wind + BESS) financial model for C&I clients"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "matplotlib",
    "pyomo>=6.7",
    "highspy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "plotly",
    "ruff>=0.6",
    "optuna",          # required by the slow tests/test_solver.py legacy suite
]
# Legacy Optuna TPE search path (hybrid_plant.legacy.solver_engine).
# Not used by the production Pyomo engine; install only to run engine: optuna.
legacy = [
    "optuna",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"
markers = [
    "slow: marks slow-running tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # The codebase deliberately packs paired one-liners (matplotlib axis setup,
    # aligned assignments). Enforcing these would churn ~50 lines to no benefit.
    "E701",   # multiple statements on one line (colon)
    "E702",   # multiple statements on one line (semicolon)
    # Aligned assignment blocks (`energy_engine  = ...`) are house style.
    "E221",   # multiple spaces before operator
    # line-length above stays the formatting target, but width is not a CI gate:
    # 60 existing lines overflow (median 105, max 143), mostly print/format
    # strings where reflowing hurts readability.
    "E501",   # line too long
]
