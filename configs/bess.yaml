bess:

  container:
    size_mwh: 5.015
    auxiliary_consumption_mwh_per_day: 0.300

  efficiency:
    charge_efficiency: 0.9721
    discharge_efficiency: 0.9384

  degradation:
    type: "soh_curve"
    file: "data/bess_soh_curve.csv"

  augmentation:
    enabled: true
    restore_to_percent_of_year1: 100
    minimum_augmentation_containers: 1
    cost_per_mwh: 0.90e7
    opex_percent_of_capex: 2.0

  salvage:
    enabled: true
    salvage_rate_per_mwh: 0

  dispatch:
    # ── Discharge window ──────────────────────────────────────────────────
    # Leave discharge_hours empty ([]) for a normal RTC solution — BESS
    # discharges freely across all 24 hours driven by the ToD reservation
    # planner.
    #
    # Set discharge_hours to restrict BESS discharge to specific hours only.
    # Outside those hours the BESS holds its SOC; the reservation planner is
    # automatically adjusted to ring-fence SOC only for the listed hours.
    #
    # charge_first controls what happens to solar/wind generation OUTSIDE
    # the discharge window:
    #
    #   false (default) — direct dispatch serves load first; surplus charges
    #                     BESS.  BESS just does not discharge outside the window.
    #
    #   true            — BESS charging gets first priority; direct dispatch
    #                     only happens from whatever generation remains after
    #                     charging.  Minimises direct solar dispatch and
    #                     maximises charge available for the window.
    #
    # Uses 0-indexed hours: 0 = midnight-1 am, 23 = 11 pm-midnight.
    # Example -- 6-hour evening window with charge-first:
    #   discharge_hours: [18, 19, 20, 21, 22, 23]
    #   charge_first: true
    discharge_hours: [18, 19, 20, 21, 22, 23]       # empty = normal RTC (no restriction)
    charge_first: true