solver:

  debug_mode: false

  # fast_mode: true  → solver trials use scalar energy projection (fast, ~2-3 min)
  # fast_mode: false → solver trials use full per-year re-simulation (accurate, ~20-40 min)
  # The final best-solution evaluation always uses full re-simulation regardless.
  fast_mode: true

  objective: "maximize_client_savings"

  baseline:
    type: "100_percent_discom"

  # ─────────────────────────────────────────────────────────────────────
  # DECISION VARIABLES
  # ─────────────────────────────────────────────────────────────────────

  decision_variables:

    # ── CURRENT SCOPE ─────────────────────────────────────────────────

    solar_capacity_mw:
      scope: current
      type: continuous
      min: 0
      max: 1000

    wind_capacity_mw:
      scope: current
      type: continuous
      min: 0
      max: 1000

    ppa_capacity_mw:
      scope: current
      type: continuous
      min: 0
      max: 1000

    bess_containers:
      scope: current
      type: integer
      min: 0
      max: 1000
      step: 1

    bess_charge_c_rate:
      scope: current
      type: continuous
      min: 0
      max: 1.0

    bess_discharge_c_rate:
      scope: current
      type: continuous
      min: 0
      max: 1.0

    # ── FUTURE SCOPE ──────────────────────────────────────────────────

    dispatch_priority:
      scope: future
      type: categorical
      options:
        - solar_first
        - wind_first
        - proportional
      fixed_value: solar_first  # value used while out of scope

    bess_charge_source:
      scope: future
      type: categorical
      options:
        - solar_only
        - wind_only
        - solar_and_wind
      fixed_value: solar_only  # value used while out of scope


  # ─────────────────────────────────────────────────────────────────────
  # CONSTRAINTS
  # ─────────────────────────────────────────────────────────────────────

  constraints:

    minimum_savings_npv:
      enabled: true
      min_value: 0              # project must beat 100% DISCOM baseline

    plant_cuf:
      enabled: false
      # Plant CUF = annual busbar MWh / (PPA_MW × 8760) × 100
      # Set min_percent or max_percent to bound the solver's solution space.
      # A max of 55 % prevents over-committed small-PPA / large-solar configs.
      min_percent: 0
      max_percent: 55

    minimum_bess_discharge:
      enabled: false
      # Hard floor on annual BESS discharge energy (busbar MWh).
      # Only enable for a contractual throughput commitment.
      # For economic optimisation use minimum_bess_capacity instead.
      min_annual_mwh: 230500

    minimum_bess_capacity:
      enabled: false
      # Minimum BESS energy capacity (MWh) at Year-1 SOH.
      # Ensures the battery is physically large enough to sustain the required
      # number of dispatch hours at full load.
      # Formula: load_MW x discharge_hours / discharge_efficiency
      #   100 MW x 6 hrs / 0.9384 = 640 MWh  (~128 containers at 5.015 MWh each)
      min_mwh: 640

    re_penetration:
      enabled: false
      # RE penetration = annual meter delivery / annual load × 100
      # Bounds the fraction of client load covered by RE at the meter.
      # Example: min 70 % forces the solver to size a plant large enough
      # to cover at least 70 % of load; max 100 % is a natural ceiling.
      min_percent: 0
      max_percent: 55

    # ── Step 6b: Required (real India PPA / grid clauses) ─────────────────
    peak_supply_obligation:
      enabled: false
      # RTC / FDRE-style guaranteed supply in defined peak blocks:
      #   Σ_{peak}(load − ddraw) ≥ min_percent/100 · Σ_{peak} load
      min_percent: 85
      peak_hours: [19, 20, 21, 22]   # 1-indexed hours-of-day

    peak_bess_discharge:
      enabled: false
      # Firm BESS dispatch commitment inside the peak window (busbar MWh/yr):
      #   Σ_{peak} η_d·dis ≥ min_annual_mwh · n_years
      peak_hours: [19, 20, 21, 22]   # 1-indexed
      min_annual_mwh: 50000

    poi_capacity:
      enabled: false
      # Physical point-of-interconnection (CTU/STU connectivity) MW limit,
      # distinct from the commercial PPA export cap:
      #   sd + wd + η_d·dis ≤ poi_mw  (every hour)
      poi_mw: 150

    sanctioned_demand:
      enabled: false
      # Client's sanctioned grid connection ceiling (DISCOM cannot backfill
      # beyond it):  ddraw ≤ demand_mw  (every hour)
      demand_mw: 100

    # ── Step 6b: easy Nice-to-have ────────────────────────────────────────
    min_grid_drawal:
      enabled: false
      # Contractual minimum grid offtake (cross-subsidy / demand-charge floor):
      #   Σ ddraw ≥ min_annual_mwh · n_years
      min_annual_mwh: 0

    energy_purchase_cap:
      enabled: false
      # Buyer-side annual energy (MU) spend ceiling on RE meter delivery:
      #   Σ(load − ddraw) ≤ max_annual_mwh · n_years
      max_annual_mwh: 0

    land_area:
      enabled: false
      # Finite site area:  S·solar_acre_per_mw + W·wind_acre_per_mw ≤ available_acres
      available_acres: 1000
      solar_acre_per_mw: 4.0
      wind_acre_per_mw: 0.5

    strict_charge_discharge:
      enabled: false
      # Hard D7 exclusivity via a per-hour binary (u=1 charge, u=0 discharge).
      # Efficiency losses usually make this redundant; a degenerate optimum can
      # still return simultaneous charge+discharge (verify flags it).  Enabling
      # turns the model into a genuine MILP (a binary per timestep) — slower.

    hourly_re_penetration_penalty:
      enabled: false
      # Soft economic penalty applied whenever RE delivery at the meter falls
      # below min_percent of client load in any individual hour.
      #
      # Shortfall energy (MWh at meter, per hour h):
      #   max( load[h] × min_percent/100 − meter_delivery[h], 0 )
      #
      # Annual penalty cost (INR):
      #   sum_h( shortfall_mwh[h] ) × 1000 × penalty_inr_per_kwh
      #
      # This cost is added to the hybrid cost each year, reducing savings NPV.
      # The solver naturally minimises penalty by sizing the plant to meet the
      # floor.  Unlike the hard re_penetration gate above, no trial is rejected;
      # instead the penalty flows directly through the economics.
      min_percent: 50.0            # RE floor applied to every individual hour (%)
      # Penalty rate = blended ToD DISCOM tariff at the hour the shortfall occurs
      # (ht_lt_split_percent-weighted blend of the HT and LT ToD rates from
      # tariffs.yaml).  No separate rate parameter is required.
      penalty_hours: [8, 9, 10, 11, 19, 20, 21, 22]  # hours in which penalty is applied (1-indexed)
      # Hours (1-indexed, 1 = midnight–1 am, 24 = 11 pm–midnight) in which the
      # RE penetration floor is enforced and penalty is charged.
      # Empty list → all 8760 hours are subject to the penalty (default).
      # Example — evening peak only: [19, 20, 21, 22]
      # Example — both peaks:        [8, 9, 10, 11, 19, 20, 21, 22]


  # ─────────────────────────────────────────────────────────────────────
  # SOLVER SETTINGS
  # ─────────────────────────────────────────────────────────────────────

  n_trials: 1500
  n_jobs: 1                     # parallel workers (1 = sequential)
  random_seed: 42